[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-animation-production-workspace"
version = "0.1.0"
description = "Local production workspace for AI Animation Director projects."
requires-python = ">=3.11"
dependencies = [
  "imageio-ffmpeg>=0.5,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
web = ["gradio>=5,<6"]
dev = ["pytest>=8,<10"]

[project.scripts]
animation-workspace = "production_workspace.cli:main"

[tool.setuptools.packages.find]
include = ["production_workspace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
